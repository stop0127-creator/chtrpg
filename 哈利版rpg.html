<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呂APM - RPG 業務修煉看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #eaddc5; /* 羊皮紙底色 */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(211, 166, 37, 0.15) 0%, transparent 40%), 
                radial-gradient(circle at 90% 80%, rgba(116, 0, 1, 0.1) 0%, transparent 40%),
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>');
            color: #2c1b18; /* 墨黑字體 */
            background-attachment: fixed;
        }
        .font-rpg {
            font-family: 'Noto Serif TC', serif;
        }
        /* Custom UI Elements - Parchment Style */
        .glass-panel {
            background: rgba(244, 236, 216, 0.9);
            backdrop-filter: blur(5px);
            border: 2px solid #740001; /* 葛來分多紅 */
            box-shadow: 0 10px 20px -5px rgba(116, 0, 1, 0.3), inset 0 0 20px rgba(211, 166, 37, 0.15);
            position: relative;
        }
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(116, 0, 1, 0.3);
            pointer-events: none;
            border-radius: inherit;
        }
        .xp-bar-container {
            background-color: #d3c4a8;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid #a38c62;
        }
        .xp-bar-fill {
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            background-image: linear-gradient(to right, #b30000, #740001, #d3a625);
            box-shadow: 0 0 10px rgba(211, 166, 37, 0.6);
        }
        /* Task Cards */
        .task-card {
            transition: all 0.2s ease;
            border-left-width: 5px;
            background: #fdfaf3; /* 更亮的紙張感 */
            border-top: 1px solid #e0d0b0;
            border-right: 1px solid #e0d0b0;
            border-bottom: 1px solid #e0d0b0;
        }
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px -3px rgba(116, 0, 1, 0.2), 0 0 8px rgba(211, 166, 37, 0.3);
        }
        
        .btn-rpg {
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn-rpg:active { transform: scale(0.95); }
        .btn-rpg::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        /* Modal Animation */
        .modal-enter { animation: modalFadeIn 0.3s ease-out forwards; }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="text-amber-950 min-h-screen p-4 md:p-8">

    <!-- Level Up Modal (Custom Alert) -->
    <div id="levelUpModal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="glass-panel p-8 rounded-xl max-w-sm w-full text-center border-[#d3a625] border-4 shadow-[0_0_40px_rgba(211,166,37,0.5)] bg-[#f4ebd8]">
            <div class="text-6xl mb-4">🦉</div>
            <h2 class="text-3xl font-bold text-[#740001] font-rpg mb-2 tracking-wider">O.W.L. 測驗通過！</h2>
            <p class="text-amber-900 mb-6 text-lg font-bold">魔法部派送了新的委任狀，你已晉升為<br><span id="newTitleText" class="text-2xl text-[#d3a625] font-black mt-2 inline-block drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]"></span></p>
            <button onclick="closeModal()" class="btn-rpg w-full bg-gradient-to-r from-[#740001] to-[#b30000] hover:from-[#5a0001] hover:to-[#8b0000] text-[#d3a625] font-bold py-3 px-4 rounded border-2 border-[#d3a625] shadow-lg">
                收下委任狀 (確認)
            </button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        
        <!-- Header: Character Status -->
        <header class="glass-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden">
            <!-- Decorative corner elements -->
            <div class="absolute top-0 left-0 w-16 h-16 border-t-4 border-l-4 border-[#740001] rounded-tl-2xl m-2 pointer-events-none opacity-50"></div>
            <div class="absolute bottom-0 right-0 w-16 h-16 border-b-4 border-r-4 border-[#740001] rounded-br-2xl m-2 pointer-events-none opacity-50"></div>

            <div class="flex items-center gap-6 z-10 w-full md:w-auto">
                <div class="w-20 h-20 bg-[#fdfaf3] rounded-full border-4 border-[#d3a625] flex items-center justify-center text-4xl shadow-[0_4px_10px_rgba(116,0,1,0.4)]">
                    ⚡
                </div>
                <div>
                    <h1 class="text-3xl font-black text-[#740001] font-rpg tracking-wide flex items-center gap-3">
                        呂APM 
                        <span class="text-sm bg-[#d3a625] border-2 border-[#740001] text-[#740001] px-2 py-1 rounded font-bold tracking-normal shadow-sm">魔法部特派員</span>
                    </h1>
                    <p id="characterTitle" class="text-xl text-[#b30000] font-rpg mt-1 font-bold">一年級新生 (First Year)</p>
                </div>
            </div>

            <div class="w-full md:w-1/2 z-10">
                <div class="flex justify-between text-sm mb-2 font-bold font-rpg tracking-wider text-[#4a2e25]">
                    <span>魔力值 (Mana / XP)</span>
                    <span id="xpText" class="text-[#740001]">0 / 1000</span>
                </div>
                <div class="h-6 w-full rounded-full overflow-hidden xp-bar-container relative">
                    <div id="xpBar" class="h-full xp-bar-fill rounded-full" style="width: 0%;"></div>
                </div>
            </div>
        </header>

        <!-- Quest Form & Board Container -->
        <main>
            <!-- Add Quest Section -->
            <div class="glass-panel rounded-xl p-5 mb-8">
                <h3 class="text-[#740001] font-rpg text-xl font-bold mb-4 flex items-center gap-2">
                    <span>🪶</span> 編寫新魔法契約 (New Quest)
                </h3>
                <form id="questForm" class="flex flex-col md:flex-row gap-4 items-end" onsubmit="addQuest(event)">
                    <div class="flex-1 w-full">
                        <label class="block text-sm text-[#5a3a2e] font-bold mb-1">任務卷軸名稱</label>
                        <input type="text" id="questName" required class="w-full bg-[#fdfaf3] border-2 border-[#d3c4a8] rounded px-4 py-2 text-[#2c1b18] focus:outline-none focus:border-[#740001] focus:ring-1 focus:ring-[#740001] transition-colors" placeholder="輸入要詠唱的目標...">
                    </div>
                    <div class="w-full md:w-48">
                        <label class="block text-sm text-[#5a3a2e] font-bold mb-1">法術層級</label>
                        <select id="questRank" class="w-full bg-[#fdfaf3] border-2 border-[#d3c4a8] rounded px-4 py-2 text-[#2c1b18] focus:outline-none focus:border-[#740001] appearance-none font-bold">
                            <option value="S">S 級 (魔法部最高機密)</option>
                            <option value="A" selected>A 級 (正氣師任務)</option>
                            <option value="B">B 級 (霍格華茲日常)</option>
                        </select>
                    </div>
                    <div class="w-full md:w-32">
                        <label class="block text-sm text-[#5a3a2e] font-bold mb-1">魔力回饋 (XP)</label>
                        <input type="number" id="questXp" required min="10" max="500" value="50" class="w-full bg-[#fdfaf3] border-2 border-[#d3c4a8] rounded px-4 py-2 text-[#2c1b18] focus:outline-none focus:border-[#740001]">
                    </div>
                    <button type="submit" class="btn-rpg w-full md:w-auto bg-[#740001] hover:bg-[#5a0001] border-2 border-[#d3a625] text-[#d3a625] font-bold py-2 px-6 rounded whitespace-nowrap shadow-md">
                        📜 簽署契約
                    </button>
                </form>
            </div>

            <!-- Kanban Board -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- Column: To Do -->
                <div class="flex flex-col gap-4">
                    <h2 class="text-xl font-rpg font-bold text-center py-2 bg-[#4a2e25] rounded-t-lg border-b-4 border-[#d3a625] text-[#f4ebd8] shadow-md">
                        🔮 預言局懸賞 (To-Do) <span id="count-todo" class="text-sm bg-[#740001] text-[#d3a625] px-2 py-0.5 rounded-full ml-2 border border-[#d3a625]"></span>
                    </h2>
                    <div id="col-todo" class="flex flex-col gap-4 min-h-[300px] p-2 bg-[#eaddc5]/60 rounded-b-lg border-2 border-[#d3c4a8] border-t-0 shadow-inner">
                        <!-- Tasks will be injected here -->
                    </div>
                </div>

                <!-- Column: In Progress -->
                <div class="flex flex-col gap-4">
                    <h2 class="text-xl font-rpg font-bold text-center py-2 bg-[#4a2e25] rounded-t-lg border-b-4 border-[#740001] text-[#f4ebd8] shadow-md">
                        🪄 施法中 (Doing) <span id="count-inprogress" class="text-sm bg-[#740001] text-[#d3a625] px-2 py-0.5 rounded-full ml-2 border border-[#d3a625]"></span>
                    </h2>
                    <div id="col-inprogress" class="flex flex-col gap-4 min-h-[300px] p-2 bg-[#eaddc5]/60 rounded-b-lg border-2 border-[#d3c4a8] border-t-0 shadow-inner">
                        <!-- Tasks will be injected here -->
                    </div>
                </div>

                <!-- Column: Done -->
                <div class="flex flex-col gap-4">
                    <h2 class="text-xl font-rpg font-bold text-center py-2 bg-[#4a2e25] rounded-t-lg border-b-4 border-[#2e5c31] text-[#f4ebd8] shadow-md">
                        ✨ 惡作劇完成 (Done) <span id="count-done" class="text-sm bg-[#740001] text-[#d3a625] px-2 py-0.5 rounded-full ml-2 border border-[#d3a625]"></span>
                    </h2>
                    <div id="col-done" class="flex flex-col gap-4 min-h-[300px] p-2 bg-[#eaddc5]/60 rounded-b-lg border-2 border-[#d3c4a8] border-t-0 shadow-inner">
                        <!-- Tasks will be injected here -->
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // System State (Default state if no localStorage is found)
        let state = {
            xp: 0,
            maxXp: 1000,
            titleIndex: 0,
            titles: [
                "一年級新生 (First Year)",
                "霍格華茲級長 (Prefect)",
                "首席正氣師 (Head Auror)",
                "魔法部長 (Minister for Magic)"
            ],
            tasks: [
                { id: 1, title: "魔法部 TDIAP 防禦陣型驗收與高層匯報", rank: "S", xp: 150, status: "todo" },
                { id: 2, title: "呼嚕網 (MDVPN) 企業通道擴建與報價單簽署", rank: "A", xp: 80, status: "todo" },
                { id: 3, title: "魔藥學跨部門交接與機動人力調度", rank: "B", xp: 50, status: "todo" }
            ],
            nextId: 4
        };

        // Load state from LocalStorage
        function loadState() {
            const savedState = localStorage.getItem('hogwartsBoardState');
            if (savedState) {
                try {
                    state = JSON.parse(savedState);
                } catch (e) {
                    console.error("Failed to parse saved state.");
                }
            }
        }

        // Save state to LocalStorage
        function saveState() {
            localStorage.setItem('hogwartsBoardState', JSON.stringify(state));
        }

        // DOM Elements
        const elXpBar = document.getElementById('xpBar');
        const elXpText = document.getElementById('xpText');
        const elCharacterTitle = document.getElementById('characterTitle');
        const modal = document.getElementById('levelUpModal');
        const newTitleText = document.getElementById('newTitleText');

        // Initialize Board
        function init() {
            loadState(); // Load saved data first
            updateStatusUI();
            renderBoard();
        }

        // Render Tasks to Columns
        function renderBoard() {
            const cols = {
                todo: document.getElementById('col-todo'),
                inprogress: document.getElementById('col-inprogress'),
                done: document.getElementById('col-done')
            };

            const counts = { todo: 0, inprogress: 0, done: 0 };

            // Clear columns
            cols.todo.innerHTML = '';
            cols.inprogress.innerHTML = '';
            cols.done.innerHTML = '';

            state.tasks.forEach(task => {
                counts[task.status]++;
                const card = document.createElement('div');
                
                // Rank styling config
                let rankLabel = '';
                let rankBorder = '';
                let badgeClass = '';
                
                if(task.rank === 'S') { 
                    rankLabel = 'S 級 (最高機密)'; 
                    rankBorder = 'border-l-[#740001]';
                    badgeClass = 'bg-[#740001] text-[#d3a625] border border-[#d3a625]';
                }
                else if(task.rank === 'A') { 
                    rankLabel = 'A 級 (正氣師任務)'; 
                    rankBorder = 'border-l-[#0e1a40]'; // Ravenclaw Blue
                    badgeClass = 'bg-[#0e1a40] text-[#d3a625] border border-[#d3a625]';
                }
                else { 
                    rankLabel = 'B 級 (霍格華茲日常)'; 
                    rankBorder = 'border-l-[#1a472a]'; // Slytherin Green
                    badgeClass = 'bg-[#1a472a] text-[#d3a625] border border-[#d3a625]';
                }

                card.className = `task-card ${rankBorder} rounded-r-lg p-4 flex flex-col gap-3 shadow-sm`;

                // Buttons based on status
                let actionHTML = '';
                if(task.status === 'todo') {
                    actionHTML = `<button onclick="moveTask(${task.id}, 'inprogress')" class="btn-rpg flex-1 bg-[#740001] hover:bg-[#5a0001] text-[#d3a625] font-bold py-1.5 px-3 rounded text-sm transition-colors border border-[#d3a625] shadow-sm">🪄 統統現跡 (Take)</button>`;
                } else if (task.status === 'inprogress') {
                    actionHTML = `
                        <button onclick="moveTask(${task.id}, 'todo')" class="btn-rpg bg-[#a38c62] hover:bg-[#85704a] text-[#fdfaf3] font-bold py-1.5 px-3 rounded text-sm transition-colors border border-[#5a3a2e]">還原咒 (Undo)</button>
                        <button onclick="moveTask(${task.id}, 'done')" class="btn-rpg flex-1 bg-[#2e5c31] hover:bg-[#1a472a] text-[#d3a625] font-bold py-1.5 px-3 rounded text-sm transition-colors border border-[#d3a625] shadow-sm">✨ 惡作劇完成 (Done)</button>
                    `;
                } else if (task.status === 'done') {
                    actionHTML = `<div class="w-full text-center text-[#2e5c31] font-bold py-1.5 text-sm flex items-center justify-center gap-1 border-t border-[#d3c4a8] pt-2"><span>🦉</span> 魔力已匯入</div>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <span class="text-xs px-2 py-1 rounded font-bold whitespace-nowrap shadow-sm ${badgeClass}">${rankLabel}</span>
                        <span class="text-xs font-bold text-[#740001] bg-[#f4ebd8] px-2 py-1 rounded flex items-center gap-1 border border-[#a38c62]">
                            ⚡ +${task.xp} XP
                        </span>
                    </div>
                    <p class="text-[#2c1b18] font-bold leading-snug mt-1 text-md">${task.title}</p>
                    <div class="flex gap-2 mt-auto pt-2">
                        ${actionHTML}
                    </div>
                `;
                cols[task.status].appendChild(card);
            });

            // Update Counts
            document.getElementById('count-todo').innerText = counts.todo;
            document.getElementById('count-inprogress').innerText = counts.inprogress;
            document.getElementById('count-done').innerText = counts.done;
        }

        // Move Task Logic
        function moveTask(id, newStatus) {
            const taskIndex = state.tasks.findIndex(t => t.id === id);
            if (taskIndex === -1) return;

            const task = state.tasks[taskIndex];
            
            // Gain XP if moved to done
            if (newStatus === 'done' && task.status !== 'done') {
                gainXP(task.xp);
            }

            task.status = newStatus;
            
            saveState(); // Save to local storage
            renderBoard();
        }

        // Add Quest Logic
        function addQuest(e) {
            e.preventDefault();
            const name = document.getElementById('questName').value;
            const rank = document.getElementById('questRank').value;
            const xp = parseInt(document.getElementById('questXp').value);

            if (!name || !xp) return;

            state.tasks.push({
                id: state.nextId++,
                title: name,
                rank: rank,
                xp: xp,
                status: 'todo'
            });

            // Reset form
            document.getElementById('questName').value = '';
            document.getElementById('questXp').value = '50';
            
            saveState(); // Save to local storage
            renderBoard();
        }

        // XP and Level Up Logic
        function gainXP(amount) {
            state.xp += amount;
            
            if (state.xp >= state.maxXp) {
                // Level Up Trigger
                state.xp = state.xp - state.maxXp;
                state.titleIndex = Math.min(state.titleIndex + 1, state.titles.length - 1);
                
                // Show Custom Modal
                showModal(state.titles[state.titleIndex]);
            }
            
            updateStatusUI();
            saveState(); // Ensure XP gain is saved
        }

        // Update Header UI
        function updateStatusUI() {
            const percentage = Math.min(Math.max((state.xp / state.maxXp) * 100, 0), 100);
            elXpBar.style.width = `${percentage}%`;
            elXpText.innerText = `${state.xp} / ${state.maxXp}`;
            elCharacterTitle.innerText = state.titles[state.titleIndex];
        }

        // Modal Controls
        function showModal(newTitle) {
            newTitleText.innerText = newTitle;
            modal.classList.remove('hidden');
            modal.children[0].classList.add('modal-enter');
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.children[0].classList.remove('modal-enter');
        }

        // Run Initialization on load
        window.onload = init;
    </script>
</body>
</html>
